<!DOCTYPE html>
<html>
<head>
<title>AJAX - Load bca.txt</title>
</head>
<body>

<button onclick="loadContent()">Load BCA Description</button>
<div id="output"></div>

<script>
function loadContent() {
    var xhttp = new XMLHttpRequest();
    xhttp.onreadystatechange = function () {
        if (this.readyState == 4 && this.status == 200) {
            document.getElementById("output").innerHTML = this.responseText;
        }
    };
    xhttp.open("GET", "bca.txt", true);
    xhttp.send();
}
</script>
</body>
</html>
