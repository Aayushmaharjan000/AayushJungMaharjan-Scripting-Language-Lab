<!DOCTYPE html>
<html><head><title>Q17 - Largest of Five Numbers</title></head>
<body>
<h2>Q17: Largest of five numbers (prompt + alert)</h2>
<button onclick="largestOfFive()">Enter Numbers</button>
<pre id="out"></pre>
<script>
// Conditional statement to find the largest of five numbers
function largestOfFive() {
  let nums = [];
  for (let i = 1; i <= 5; i++) {
    const val = parseFloat(prompt(`Enter number ${i}:`));
    nums.push(val);
  }

  let largest = nums[0];
  for (let i = 1; i < nums.length; i++) {
    if (nums[i] > largest) {
      largest = nums[i];
    }
  }

  alert(`The largest number is: ${largest}`);
  document.getElementById('out').textContent =
    `Numbers entered: ${nums.join(', ')}\nLargest: ${largest}`;
}
</script>
</body></html>
