<!DOCTYPE html>
<html><head><title>Q13 - Join Array Elements</title></head>
<body>
<h2>Q13: Join all elements of an array into a string</h2>
<pre id="out"></pre>
<script>
let myColor = ["Red", "Green", "White", "Black"];
let joined = myColor.join(', ');
console.log(joined); // "Red, Green, White, Black"

document.getElementById('out').textContent =
  `Array: [${myColor}]\nJoined: "${joined}"`;
</script>
</body></html>
