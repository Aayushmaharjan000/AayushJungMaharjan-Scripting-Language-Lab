<!DOCTYPE html>
<html>
<head>
<title>Q29 - Numbers 0 to 100</title>
<style>
  #container { display: flex; flex-wrap: wrap; max-width: 700px; }
  .num { width: 40px; height: 40px; display: flex; align-items: center;
         justify-content: center; margin: 2px; border-radius: 4px; font-family: Arial; }
</style>
</head>
<body>
  <h2>Q29: Numbers 0-100 (Green=Even, Yellow=Odd, Red=Prime)</h2>
  <div id="container"></div>

<script>
function isPrime(n) {
  if (n < 2) return false;
  for (let i = 2; i <= Math.sqrt(n); i++) {
    if (n % i === 0) return false;
  }
  return true;
}

const container = document.getElementById('container');

for (let i = 0; i <= 100; i++) {
  const div = document.createElement('div');
  div.textContent = i;
  div.className = 'num';

  if (isPrime(i)) {
    div.style.background = 'red';
    div.style.color = 'white';
  } else if (i % 2 === 0) {
    div.style.background = 'green';
    div.style.color = 'white';
  } else {
    div.style.background = 'yellow';
  }

  container.appendChild(div);
}
</script>
</body>
</html>
