<!DOCTYPE html>
<html>
<head>
<title>Q33 - Calculator</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; }
  .calculator { width: 260px; margin: 30px auto; }
  #display { width: 100%; height: 45px; font-size: 20px; text-align: right;
              padding: 5px; box-sizing: border-box; }
  .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 5px; }
  button { padding: 15px; font-size: 18px; border: none; border-radius: 4px;
           background: #2e7d32; color: white; cursor: pointer; }
  #clearBtn { background: #c62828; }
</style>
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" readonly>
    <div class="buttons">
      <button onclick="clearDisplay()" id="clearBtn">C</button>
      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button onclick="appendValue('/')">/</button>
      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button onclick="appendValue('*')">*</button>
      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button onclick="appendValue('-')">-</button>
      <button onclick="appendValue('0')">0</button>
      <button onclick="appendValue('.')">.</button>
      <button onclick="calculateResult()">=</button>
      <button onclick="appendValue('+')">+</button>
    </div>
  </div>

<script>
const display = document.getElementById('display');

function appendValue(val) {
  display.value += val;
}

function clearDisplay() {
  display.value = '';
}

function calculateResult() {
  try {
    // Safe-ish evaluation restricted to digits/operators only
    if (/^[0-9+\-*/.\s]+$/.test(display.value)) {
      display.value = eval(display.value).toString();
    } else {
      display.value = 'Error';
    }
  } catch (e) {
    display.value = 'Error';
  }
}
</script>
</body>
</html>
